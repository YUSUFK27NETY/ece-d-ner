<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#0b1220">
    <title>Şifre Sıfırla | Platform V2</title>
    <link rel="stylesheet" href="/owner/owner.css">
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script defer src="/owner/config.js"></script>
    <script defer src="/owner/reset-password.js"></script>
</head>
<body>
    <div class="center-shell">
        <form id="reset-password-form" class="panel auth-card" autocomplete="on">
            <p class="eyebrow">Platform V2</p>
            <h1>Şifre Sıfırla</h1>
            <p class="muted">İşletme kodunu ve owner e-postanı gir. Uygun hesaba Firebase şifre sıfırlama bağlantısı gönderilir.</p>
            <label>
                İşletme kodu
                <input id="reset-password-tenant" autocomplete="off" placeholder="ela-doner" required>
            </label>
            <label>
                E-posta
                <input id="reset-password-email" type="email" autocomplete="email" maxlength="254" required>
            </label>
            <button id="reset-password-submit" type="submit" class="primary">Sıfırlama bağlantısı gönder</button>
            <p id="reset-password-message" class="message" role="status"></p>
            <p class="muted"><a href="/owner/">Giriş ekranına dön</a></p>
        </form>
    </div>
</body>
</html>
