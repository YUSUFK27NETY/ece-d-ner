<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#0b1220">
    <title>Kalıcı Şifre Belirle | Platform V2</title>
    <link rel="stylesheet" href="/owner/owner.css">
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script defer src="/owner/config.js"></script>
    <script defer src="/owner/set-password.js"></script>
</head>
<body>
    <div class="center-shell">
        <main class="panel auth-card">
            <p class="eyebrow">Platform V2</p>
            <h1>Kalıcı Şifre Belirle</h1>
            <p class="muted">Bu işlem yalnız doğrulanmış owner oturumunda çalışır. Şifre tarayıcı depolamasına kaydedilmez.</p>
            <form id="set-password-form" autocomplete="on" hidden>
                <label>
                    Yeni şifre
                    <input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                </label>
                <label>
                    Yeni şifre tekrar
                    <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                </label>
                <button id="set-password-submit" type="submit" class="primary">Şifreyi kaydet</button>
            </form>
            <p id="set-password-message" class="message" role="status">Owner oturumu doğrulanıyor…</p>
            <p id="set-password-next" hidden><a id="set-password-owner-link" href="/owner/">Owner paneline geç</a></p>
            <p><a id="set-password-login-link" href="/owner/email-login.html">Şifresiz giriş bağlantısı iste</a></p>
        </main>
    </div>
</body>
</html>
