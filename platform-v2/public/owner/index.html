<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#0b1220">
    <title>İşletme Girişi | Platform V2</title>
    <link rel="stylesheet" href="/owner/owner.css">
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script defer src="/owner/config.js"></script>
    <script defer src="/owner/login.js"></script>
</head>
<body>
    <div class="center-shell">
        <form id="owner-login-form" class="panel auth-card" autocomplete="on">
            <p class="eyebrow">İşletme Paneli</p>
            <h1>İşletme Girişi</h1>
            <p class="muted">E-posta ve şifrenizle giriş yapın. Hesabınıza bağlı işletme otomatik açılır.</p>
            <label>
                E-posta
                <input id="owner-email" type="email" autocomplete="username" required>
            </label>
            <label>
                Şifre
                <input id="owner-password" type="password" autocomplete="current-password" required>
            </label>
            <button id="owner-login-button" type="submit" class="primary">Giriş yap</button>
            <p class="muted"><a href="/owner/reset-password.html">Şifremi unuttum</a></p>
            <p id="owner-login-message" class="message" role="status" aria-live="polite"></p>
        </form>
    </div>
</body>
</html>
