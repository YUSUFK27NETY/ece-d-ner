<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#0b1220">
    <title>Şifresiz İşletme Girişi | Platform V2</title>
    <link rel="stylesheet" href="/owner/owner.css">
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script defer src="/owner/config.js"></script>
    <script defer src="/owner/email-login.js"></script>
</head>
<body>
    <div class="center-shell">
        <form id="email-login-form" class="panel auth-card" autocomplete="on">
            <p class="eyebrow">Platform V2</p>
            <h1>Şifresiz İşletme Girişi</h1>
            <p class="muted">Owner hesabına Firebase e-posta bağlantısıyla güvenli giriş yap.</p>
            <label>
                İşletme kodu
                <input id="email-login-tenant" autocomplete="off" placeholder="ela-doner" required>
            </label>
            <label>
                E-posta
                <input id="email-login-email" type="email" autocomplete="email" required>
            </label>
            <button id="email-login-submit" type="submit" class="primary">Giriş bağlantısı gönder</button>
            <p id="email-login-message" class="message" role="status"></p>
            <p class="muted"><a href="/owner/">Şifreli giriş ekranına dön</a></p>
        </form>
    </div>
</body>
</html>
