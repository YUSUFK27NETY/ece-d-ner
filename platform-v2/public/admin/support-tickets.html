<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#111827">
    <title>Platform V2 | Destek Talepleri</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <link rel="stylesheet" href="/admin/support-tickets.css">
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script defer src="/admin/config.js"></script>
    <script defer src="/admin/auth-isolation.js"></script>
    <script defer src="/admin/support-tickets.js"></script>
</head>
<body>
    <header class="topbar">
        <div>
            <p class="eyebrow">Platform V2 · Destek</p>
            <h1>Destek Talepleri</h1>
            <p class="muted">Tüm tenant destek taleplerini merkezi olarak yönet.</p>
        </div>
        <div class="top-actions">
            <a class="button secondary" href="/admin/support-dashboard.html">Destek Merkezi</a>
            <a class="button secondary" href="/admin/">Merkezi Yönetim</a>
            <button id="tickets-refresh" type="button" class="secondary">Yenile</button>
            <span id="tickets-session" class="muted">Oturum kontrol ediliyor…</span>
        </div>
    </header>

    <main class="tickets-shell">
        <p id="tickets-message" class="message" role="status" aria-live="polite"></p>

        <section class="panel tickets-toolbar">
            <label>
                Tenant ID
                <input id="tenant-filter" type="search" placeholder="örn. ela-doner" autocomplete="off">
            </label>
            <label>
                Durum
                <select id="status-filter">
                    <option value="all">Tümü</option>
                    <option value="open">Açık</option>
                    <option value="in_review">İnceleniyor</option>
                    <option value="resolved">Çözüldü</option>
                </select>
            </label>
            <button id="apply-filter" type="button" class="primary compact">Filtrele</button>
        </section>

        <section class="tickets-layout">
            <section class="panel tickets-list-panel">
                <div class="section-title">
                    <div>
                        <p class="eyebrow">Kayıtlar</p>
                        <h2>Destek kuyruğu</h2>
                    </div>
                    <span id="ticket-count" class="badge">0</span>
                </div>
                <div id="ticket-list" class="ticket-admin-list"></div>
            </section>

            <section id="ticket-detail-panel" class="panel tickets-detail-panel">
                <div id="ticket-empty" class="ticket-empty">
                    <h2>Bir destek talebi seç</h2>
                    <p class="muted">Detay ve durum yönetimi burada görünür.</p>
                </div>

                <div id="ticket-detail" class="hidden">
                    <div class="section-title">
                        <div>
                            <p id="detail-tenant" class="eyebrow">Tenant</p>
                            <h2 id="detail-subject">Destek talebi</h2>
                        </div>
                        <span id="detail-status" class="ticket-status">—</span>
                    </div>
                    <p id="detail-meta" class="muted"></p>
                    <div id="detail-description" class="ticket-description"></div>

                    <section class="ticket-history-section">
                        <h3>Geçmiş</h3>
                        <div id="detail-history" class="ticket-history-list"></div>
                    </section>

                    <form id="status-form" class="ticket-status-form">
                        <label>
                            Yeni durum
                            <select id="next-status"></select>
                        </label>
                        <label>
                            Owner’a görünen not
                            <textarea id="status-note" rows="4" maxlength="1000"
                                placeholder="İsteğe bağlı kısa açıklama"></textarea>
                        </label>
                        <button id="status-submit" type="submit" class="primary">Durumu güncelle</button>
                        <p id="status-message" class="message" role="status" aria-live="polite"></p>
                    </form>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
