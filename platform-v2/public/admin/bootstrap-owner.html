<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#111827">
    <title>Platform V2 | Initial Owner Bootstrap</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script defer src="/admin/config.js"></script>
    <script defer src="/admin/bootstrap-owner.js"></script>
    <script defer src="/admin/tenant-query-prefill.js"></script>
</head>
<body>
    <div class="center-shell">
        <main class="panel auth-card">
            <p class="eyebrow">Platform V2</p>
            <h1>Initial Owner Ata</h1>
            <p class="muted">Yalnız provisioning tenant için, mevcut Platform Admin oturumuyla çalışır.</p>
            <p id="bootstrap-session" class="muted">Oturum kontrol ediliyor...</p>

            <form id="bootstrap-owner-form" novalidate>
                <label>
                    Tenant ID
                    <input id="bootstrap-tenant-id" autocomplete="off" placeholder="ornek-isletme" required>
                </label>
                <label>
                    Firebase User UID
                    <input id="bootstrap-firebase-uid" autocomplete="off" spellcheck="false" required>
                    <small>UID yalnız bootstrap isteğinde kullanılır; bu sayfa değeri saklamaz.</small>
                </label>
                <button id="bootstrap-owner-button" type="submit" class="primary">Tenant Owner Ata</button>
            </form>

            <p id="bootstrap-owner-message" class="message" role="status"></p>
            <p><a href="/admin/">Merkezi yönetime dön</a></p>
        </main>
    </div>
</body>
</html>
