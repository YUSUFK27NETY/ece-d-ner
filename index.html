<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>Ece Döner | QR Menü Pro</title>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- FAVICON -->
    <link
        rel="icon"
        href="logo.png"
        type="image/png"
    >
</head>

<body>

    <!-- =========================
         ÜST MENÜ
    ========================== -->

    <header class="topbar">

        <div class="brand">

            <img
                src="logo.png"
                alt="Ece Döner Logo"
            >

            <h2>ECE DÖNER</h2>

        </div>


        <div
            class="cart"
            aria-label="Sepet"
        >
            🛒

            <span id="cartCount">
                0
            </span>
        </div>

    </header>


    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <div class="overlay"></div>

        <div class="hero-content">

            <img
                src="logo.png"
                alt="Ece Döner"
                class="logo"
            >

            <h1>
                ECE DÖNER
            </h1>

            <p>
                Kalitenin Gerçek Lezzeti
            </p>


            <div class="status">

                <span class="open">
                    🟢 Şu Anda Açık
                </span>

                <span class="rating">
                    ⭐ 4.8
                </span>

            </div>

        </div>

    </section>


    <!-- =========================
         ANA BUTONLAR
    ========================== -->

    <section class="home-buttons">

        <button
            id="restaurantBtn"
            type="button"
        >
            🍽️ Restoranda Sipariş
        </button>


        <button
            id="packageBtn"
            type="button"
        >
            🛵 Paket Sipariş
        </button>


        <button
            id="menuBtn"
            type="button"
        >
            📖 Menüyü İncele
        </button>

    </section>


    <!-- =========================
         KATEGORİLER
    ========================== -->

    <section class="categories-section">

        <h2>
            Menü
        </h2>


        <div class="categories">

            <button
                class="active"
                data-category="all"
                type="button"
            >
                Tümü
            </button>


            <button
                data-category="doner"
                type="button"
            >
                Döner
            </button>


            <button
                data-category="menu"
                type="button"
            >
                Menüler
            </button>


            <button
                data-category="drink"
                type="button"
            >
                İçecekler
            </button>


            <button
                data-category="dessert"
                type="button"
            >
                Tatlılar
            </button>

        </div>

    </section>


    <!-- =========================
         ARAMA
    ========================== -->

    <section class="search-area">

        <input
            type="text"
            id="search"
            placeholder="🔍 Ürün Ara..."
            autocomplete="off"
            aria-label="Ürün ara"
        >

    </section>


    <!-- =========================
         MENÜ
    ========================== -->

    <section
        class="menu-section"
        id="menu"
    >

        <h2>
            🍽️ Popüler Lezzetler
        </h2>


        <div
            class="menu-grid"
            id="menuGrid"
        >

            <!--
                Firebase ürünleri
                script.js tarafından
                buraya eklenecek.
            -->

        </div>

    </section>


    <!-- =========================
         SEPET
    ========================== -->

    <section class="cart-box">

        <h2>
            🛒 Sepetim
        </h2>


        <ul id="cartItems"></ul>


        <h3 id="totalPrice">
            Toplam: 0₺
        </h3>


        <button
            id="finishOrder"
            type="button"
        >
            Siparişi Tamamla
        </button>

    </section>


    <!-- =========================
         TOAST
    ========================== -->

    <div
        id="toast"
        role="status"
        aria-live="polite"
    >
        Ürün Sepete Eklendi ✅
    </div>


    <!-- =========================
         SİPARİŞ MODALI
    ========================== -->

    <div
        id="orderModal"
        class="order-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="orderModalTitle"
    >

        <div class="order-modal-content">


            <!-- KAPAT -->

            <button
                type="button"
                id="closeOrderModal"
                class="close-order-modal"
                aria-label="Sipariş penceresini kapat"
            >
                ×
            </button>


            <!-- BAŞLIK -->

            <h2 id="orderModalTitle">
                🛒 Siparişini Tamamla
            </h2>


            <p class="order-subtitle">
                Bilgilerini gir, siparişini hemen gönder.
            </p>


            <!-- =====================
                 SİPARİŞ ÖZETİ
            ====================== -->

            <div class="order-summary">

                <h3>
                    📋 Sipariş Özeti
                </h3>


                <div id="orderSummaryItems"></div>


                <div
                    id="orderSummaryTotal"
                    class="order-summary-total"
                >
                    Toplam: 0₺
                </div>

            </div>


            <!-- =====================
                 FORM
            ====================== -->

            <form id="orderForm">


                <!-- AD SOYAD -->

                <label for="customerName">
                    👤 Ad Soyad
                </label>


                <input
                    type="text"
                    id="customerName"
                    name="customerName"
                    placeholder="Adınız ve soyadınız"
                    autocomplete="name"
                    minlength="2"
                    required
                >


                <!-- TELEFON -->

                <label for="customerPhone">
                    📱 Telefon
                </label>


                <input
                    type="tel"
                    id="customerPhone"
                    name="customerPhone"
                    placeholder="05XX XXX XX XX"
                    autocomplete="tel"
                    inputmode="tel"
                    required
                >


                <!-- SİPARİŞ TÜRÜ -->

                <label for="orderType">
                    📦 Sipariş Türü
                </label>


                <select
                    id="orderType"
                    name="orderType"
                >

                    <option value="Paket Sipariş">
                        🛵 Paket Sipariş
                    </option>


                    <option value="Restoranda Sipariş">
                        🍽️ Restoranda Sipariş
                    </option>

                </select>


                <!-- MASA NO -->

                <label for="tableNumber">
                    🪑 Masa No
                </label>


                <input
                    type="text"
                    id="tableNumber"
                    name="tableNumber"
                    placeholder="Masa numarası"
                    inputmode="numeric"
                >


                <!-- ADRES -->

                <label for="orderAddress">
                    📍 Adres
                </label>


                <textarea
                    id="orderAddress"
                    name="orderAddress"
                    placeholder="Teslimat adresiniz"
                    rows="3"
                    autocomplete="street-address"
                ></textarea>


                <!-- SİPARİŞ NOTU -->

                <label for="orderNote">
                    📝 Sipariş Notu
                </label>


                <textarea
                    id="orderNote"
                    name="orderNote"
                    placeholder="Örn: Soğansız olsun..."
                    rows="3"
                ></textarea>


                <!-- GÖNDER -->

                <button
                    type="submit"
                    class="send-order-btn"
                >
                    📲 WhatsApp'tan Sipariş Ver
                </button>

            </form>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
