name: dependency-lock-refresh

on:
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-lock-refresh.yml"

permissions:
  contents: read

jobs:
  lock-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate frozen install
        run: npm ci --ignore-scripts

      - name: Validate production dependency tree
        run: npm ls --omit=dev --omit=optional

      - name: Trace uuid dependency paths
        run: npm ls uuid --all || true

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Audit production dependencies
        run: node scripts/audit-production-dependencies.js
