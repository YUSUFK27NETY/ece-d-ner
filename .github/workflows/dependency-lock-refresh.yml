name: dependency-lock-refresh

on:
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-lock-refresh.yml"

permissions:
  contents: read

jobs:
  lock-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate frozen install
        run: npm ci --ignore-scripts

      - name: Assert patched uuid only
        run: |
          node - <<'NODE'
          const lock = require("./package-lock.json");
          const versions = Object.entries(lock.packages || {})
            .filter(([path]) => /node_modules\/uuid$/.test(path))
            .map(([, value]) => value.version);
          if (versions.length === 0 || versions.some(version => version !== "11.1.1")) {
            throw new Error(`Beklenmeyen uuid sürümleri: ${versions.join(", ")}`);
          }
          console.log("uuid dependency patched:", versions.join(", "));
          NODE

      - name: Trace uuid dependency paths
        run: npm ls uuid --all || true

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
