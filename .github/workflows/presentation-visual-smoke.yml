name: Presentation visual smoke

on:
  pull_request:
    paths:
      - "platform-v2/public/storefront/**"
      - "platform-v2/src/presentation/**"
      - "platform-v2/tests/helpers/presentation-visual-smoke-server.js"
      - ".github/workflows/presentation-visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start isolated storefront fixture
        run: |
          node platform-v2/tests/helpers/presentation-visual-smoke-server.js > /tmp/presentation-smoke-server.log 2>&1 &
          echo $! > /tmp/presentation-smoke-server.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/presentation-smoke-server.log
          exit 1

      - name: Verify Starter Business and Pro in browser
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "Chrome/Chromium executable not found on runner."
            exit 1
          fi

          mkdir -p artifacts /tmp/presentation-dom

          assert_tier() {
            local tier="$1"
            local hero="$2"
            local offering="$3"
            local footer="$4"
            local density="$5"
            local motion="$6"
            local typography="$7"
            local url="http://127.0.0.1:4173/m/demo-${tier}"
            local dom="/tmp/presentation-dom/${tier}.html"

            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --virtual-time-budget=3500 \
              --dump-dom \
              "$url" > "$dom"

            grep -q "data-presentation-tier=\"${tier}\"" "$dom"
            grep -q "data-presentation-hero=\"${hero}\"" "$dom"
            grep -q "data-presentation-offering=\"${offering}\"" "$dom"
            grep -q "data-presentation-footer=\"${footer}\"" "$dom"
            grep -q "data-presentation-density=\"${density}\"" "$dom"
            grep -q "data-presentation-motion=\"${motion}\"" "$dom"
            grep -q "data-presentation-typography=\"${typography}\"" "$dom"
            grep -q "ATLAS STUDIO ${tier^^}" "$dom"
            if grep -q 'id="storefront" class="hidden"' "$dom"; then
              echo "${tier}: storefront remained hidden"
              exit 1
            fi
            if grep -q 'id="catalog-section" class="section hidden"' "$dom"; then
              echo "${tier}: catalog remained hidden"
              exit 1
            fi

            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --virtual-time-budget=3500 \
              --window-size=1440,1200 \
              --screenshot="artifacts/${tier}-desktop.png" \
              "$url"

            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --virtual-time-budget=3500 \
              --window-size=390,1000 \
              --screenshot="artifacts/${tier}-mobile.png" \
              "$url"
          }

          assert_tier starter compact standard compact compact minimal system
          assert_tier business featured advanced expanded comfortable functional professional
          assert_tier pro immersive signature editorial luxury refined editorial

      - name: Stop isolated storefront fixture
        if: always()
        run: |
          if [[ -f /tmp/presentation-smoke-server.pid ]]; then
            kill "$(cat /tmp/presentation-smoke-server.pid)" 2>/dev/null || true
          fi
          cat /tmp/presentation-smoke-server.log || true

      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-visual-smoke-${{ github.sha }}
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
