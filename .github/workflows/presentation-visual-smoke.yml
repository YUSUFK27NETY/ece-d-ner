name: Presentation visual smoke

on:
  pull_request:
    paths:
      - "platform-v2/public/storefront/**"
      - "platform-v2/src/presentation/**"
      - "platform-v2/tests/helpers/presentation-visual-smoke-server.js"
      - ".github/workflows/presentation-visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start isolated storefront fixture
        run: |
          node platform-v2/tests/helpers/presentation-visual-smoke-server.js > /tmp/presentation-smoke-server.log 2>&1 &
          echo $! > /tmp/presentation-smoke-server.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/presentation-smoke-server.log
          exit 1

      - name: Verify tiers and Business design families in browser
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "Chrome/Chromium executable not found on runner."
            exit 1
          fi

          mkdir -p artifacts /tmp/presentation-dom

          assert_case() {
            local tenant="$1"
            local tier="$2"
            local family="$3"
            local hero="$4"
            local offering="$5"
            local footer="$6"
            local density="$7"
            local motion="$8"
            local typography="$9"
            local offering_kind="${10}"
            local catalog_title="${11}"
            local url="http://127.0.0.1:4173/m/${tenant}"
            local dom="/tmp/presentation-dom/${tenant}.html"

            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --virtual-time-budget=4000 \
              --dump-dom \
              "$url" > "$dom"

            grep -q "data-presentation-tier=\"${tier}\"" "$dom"
            grep -q "data-design-family=\"${family}\"" "$dom"
            grep -q "data-presentation-hero=\"${hero}\"" "$dom"
            grep -q "data-presentation-offering=\"${offering}\"" "$dom"
            grep -q "data-presentation-footer=\"${footer}\"" "$dom"
            grep -q "data-presentation-density=\"${density}\"" "$dom"
            grep -q "data-presentation-motion=\"${motion}\"" "$dom"
            grep -q "data-presentation-typography=\"${typography}\"" "$dom"
            grep -q "data-offering-kind=\"${offering_kind}\"" "$dom"
            grep -q "id=\"catalog-title\">${catalog_title}</h2>" "$dom"
            if grep -q 'id="storefront" class="hidden"' "$dom"; then
              echo "${tenant}: storefront remained hidden"
              exit 1
            fi
            if grep -q 'id="catalog-section" class="section hidden"' "$dom"; then
              echo "${tenant}: catalog remained hidden"
              exit 1
            fi

            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --virtual-time-budget=4000 \
              --window-size=1440,1200 \
              --screenshot="artifacts/${tenant}-desktop.png" \
              "$url"

            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --virtual-time-budget=4000 \
              --window-size=390,1000 \
              --screenshot="artifacts/${tenant}-mobile.png" \
              "$url"
          }

          assert_case demo-starter starter modern compact standard compact compact minimal system services Hizmetler
          assert_case demo-business business modern featured advanced expanded comfortable functional professional services Hizmetler
          assert_case demo-pro pro editorial immersive signature editorial luxury refined editorial services Hizmetler
          assert_case demo-no-whatsapp business modern featured advanced expanded comfortable functional professional services Hizmetler

          for family in modern warm bold corporate editorial minimal; do
            assert_case "demo-business-${family}" business "${family}" featured advanced expanded comfortable functional professional services Hizmetler
          done

          disabled_dom="/tmp/presentation-dom/demo-no-whatsapp.html"
          if grep -q 'https://wa.me/' "$disabled_dom"; then
            echo "demo-no-whatsapp: disabled WhatsApp leaked into rendered actions"
            exit 1
          fi
          grep -q 'href="tel:+903420000000"' "$disabled_dom"

      - name: Stop isolated storefront fixture
        if: always()
        run: |
          if [[ -f /tmp/presentation-smoke-server.pid ]]; then
            kill "$(cat /tmp/presentation-smoke-server.pid)" 2>/dev/null || true
          fi
          cat /tmp/presentation-smoke-server.log || true

      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-visual-smoke-${{ github.sha }}
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
