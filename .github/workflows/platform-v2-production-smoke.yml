name: Platform V2 production smoke

on:
  push:
    branches:
      - main
    paths:
      - "platform-v2/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLATFORM_V2_SMOKE_BASE_URL: https://business-platform-v2-production.onrender.com
      PLATFORM_V2_SMOKE_TENANT_ID: ela-doner
      PLATFORM_V2_SMOKE_EXPECTED_COMMIT: ${{ github.sha }}
      PLATFORM_V2_SMOKE_TIMEOUT_MS: "18000"
      PLATFORM_V2_SMOKE_ATTEMPTS: "24"
      PLATFORM_V2_SMOKE_RETRY_DELAY_MS: "10000"
      PLATFORM_V2_RUNTIME_ASSET_ATTEMPTS: "3"
      PLATFORM_V2_RUNTIME_ASSET_RETRY_DELAY_MS: "2000"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Wait for Render auto-deploy window
        run: sleep 30

      - name: Verify exact Platform V2 production revision
        run: node platform-v2/scripts/check-production-smoke.js

      - name: Verify storefront runtime assets
        run: node platform-v2/scripts/check-storefront-runtime-assets.js
