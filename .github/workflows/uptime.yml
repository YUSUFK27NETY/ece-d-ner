name: Uptime smoke checks

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public site
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 5 \
            --max-time 20 \
            https://yusufk27nety.github.io/ece-d-ner/ \
            > /dev/null

      - name: Check backend health and hardening headers
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 5 \
            --max-time 30 \
            --dump-header /tmp/ece-backend-headers.txt \
            --output /tmp/ece-backend-body.json \
            https://ece-d-ner-1.onrender.com/

          grep -qi '^content-security-policy:' /tmp/ece-backend-headers.txt
          grep -qi '^x-request-id:' /tmp/ece-backend-headers.txt

          BODY="$(cat /tmp/ece-backend-body.json)"
          export BODY

          node -e '
            const body = process.env.BODY;
            const parsed = JSON.parse(body);
            if (parsed?.success !== true || parsed?.status !== "ok") {
              throw new Error(`Unexpected backend health response: ${body}`);
            }
          '
