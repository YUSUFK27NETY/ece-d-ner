name: Uptime and security smoke checks

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-uptime-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Wait for backend deploy and verify hardening headers
        run: |
          for attempt in $(seq 1 10); do
            rm -f /tmp/ece-backend-headers.txt /tmp/ece-backend-body.json

            if curl --fail --silent --show-error --location \
              --max-time 20 \
              --dump-header /tmp/ece-backend-headers.txt \
              --output /tmp/ece-backend-body.json \
              https://ece-d-ner-1.onrender.com/; then

              if grep -qi '^content-security-policy:' /tmp/ece-backend-headers.txt \
                && grep -qi '^x-request-id:' /tmp/ece-backend-headers.txt \
                && BODY="$(cat /tmp/ece-backend-body.json)" node -e '
                  const body = process.env.BODY;
                  const parsed = JSON.parse(body);
                  if (parsed?.success !== true || parsed?.status !== "ok") {
                    process.exit(1);
                  }
                '; then
                echo "Backend health and hardening headers verified."
                exit 0
              fi
            fi

            echo "Backend hardening is not ready yet (attempt ${attempt}/10)."

            if [ "$attempt" -lt 10 ]; then
              sleep 15
            fi
          done

          echo "Backend hardening verification failed. Last response headers:"
          cat /tmp/ece-backend-headers.txt || true
          exit 1

      - name: Check customer site, backend and Firestore status
        run: node scripts/check-live-endpoints.js
